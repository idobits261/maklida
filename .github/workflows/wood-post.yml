name: woodshmood-post
on:
  push:
    branches: [main]
    paths: ['wood/queue/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency: wood-post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post queued videos to Buffer
        env:
          BUFFER_WOOD_KEY: ${{ secrets.BUFFER_WOOD_KEY }}
        run: python3 wood/process_queue.py
      - name: Save result
        if: always()
        run: |
          git config user.name "wood-bot"
          git config user.email "noreply@github.com"
          git add -A wood/queue
          git diff --cached --quiet || git commit -m "wood: queue processed"
          git pull --rebase origin main
          git push origin main
